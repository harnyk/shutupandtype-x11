version: "3"

tasks:
  snapshot:
    desc: Build a local snapshot with goreleaser
    cmds:
      - goreleaser release --snapshot --clean

  install:
    desc: Install the latest snapshot deb with apt (resolves dependencies)
    cmds:
      - sudo -v
      - task: snapshot
      - dpkg -s shutupandtype-x11 >/dev/null 2>&1 && sudo apt remove -y shutupandtype-x11 || true
      - sudo dpkg -i ./dist/shutupandtype-x11_*.deb || true
      - sudo apt --fix-broken install -y

  build:
    desc: Build local binary (CGO required for tray/hotkey)
    cmds:
      - CGO_ENABLED=1 go build -o shutupandtype-x11 .

  run:
    desc: Build and run locally
    deps: [build]
    cmds:
      - ./shutupandtype-x11

  app:
    desc: Build and install ~/Applications/ShutUpAndType.app (menu bar, no Terminal)
    cmds:
      - bash scripts/macos-app.sh

  app:open:
    desc: Install .app and launch it
    deps: [app]
    cmds:
      - open "$HOME/Applications/ShutUpAndType.app"
